name: Specs CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell quality
        run: shellcheck scripts/*.sh
      - name: Validate spec indexes
        run: scripts/check-spec-indexes.sh
